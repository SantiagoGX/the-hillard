<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Navy background -->
  <rect width="100" height="100" fill="#1C2535"/>
  <!-- Outer arch frame -->
  <path d="M30 82 L30 44 A20 20 0 0 1 70 44 L70 82" fill="none" stroke="#F5EFE6" stroke-width="3" stroke-linecap="square"/>
  <!-- Base line -->
  <line x1="24" y1="82" x2="76" y2="82" stroke="#F5EFE6" stroke-width="3"/>
  <!-- Inner arch -->
  <path d="M38 82 L38 49 A12 12 0 0 1 62 49 L62 82" fill="none" stroke="#F5EFE6" stroke-width="1.8" stroke-linecap="square"/>
  <!-- Center vertical mullion -->
  <line x1="50" y1="61" x2="50" y2="82" stroke="#F5EFE6" stroke-width="1.8"/>
  <!-- Horizontal rail -->
  <line x1="38" y1="68" x2="62" y2="68" stroke="#F5EFE6" stroke-width="1.8"/>
  <!-- Gold keystone -->
  <circle cx="50" cy="27" r="3.5" fill="#C4A265"/>
</svg>
